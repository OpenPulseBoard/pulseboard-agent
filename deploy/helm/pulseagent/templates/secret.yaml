{{- if not .Values.pulseboard.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pulseagent.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pulseagent.labels" . | nindent 4 }}
type: Opaque
stringData:
  pulseboard_url: {{ required "pulseboard.url is required" .Values.pulseboard.url | quote }}
  enroll_token: {{ required "pulseboard.enrollToken is required" .Values.pulseboard.enrollToken | quote }}
{{- end }}
